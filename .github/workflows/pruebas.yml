name: Pruebas unitarias 

on: 
  push: 
    branches: [ main ] 
  pull_request: 
    branches: [ main ] 
  workflow_dispatch: 

permissions: 
  contents: read 
  checks: write 

jobs: 
  pruebas: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Obtener el código del repositorio 
        uses: actions/checkout@v7 
        
      - name: Configurar Java 17 
        uses: actions/setup-java@v5 
        with: 
          distribution: 'temurin' 
          java-version: '17' 
      - name: Descargar JUnit 
        run: curl -fsSL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.14.4/junit-platform-console-standalone-1.14.4.jar
      
      - name: Compilar el código y las pruebas 
        run: javac -encoding ISO-8859-1 -cp junit.jar -d out src/*/*.java test/*/*.java        
      
      - name: Ejecutar las pruebas unitarias 
        run: java -jar junit.jar execute -cp out --scan-classpath --reports-dir reportes         
      
      - name: Publicar el reporte de pruebas 
        if: ${{ !cancelled() }} 
        uses: mikepenz/action-junit-report@v5 
        with: 
          report_paths: 'reportes/TEST-*.xml' 
      
      - name: Guardar los reportes como artefacto 
        if: ${{ !cancelled() }} 
        uses: actions/upload-artifact@v6 
        with: 
          name: reportes-pruebas 
          path: reportes/  
